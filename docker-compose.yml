services:
  mysql:
    image: mysql:8.0
    container_name: matchmate-mysql
    restart: always
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: matchmate
      MYSQL_USER: ${DB_USERNAME:-matchmate}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./matchmate-server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - matchmate-net

  redis:
    image: redis:7-alpine
    container_name: matchmate-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - matchmate-net

  server:
    build:
      context: ./matchmate-server
      dockerfile: Dockerfile
    container_name: matchmate-server
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/matchmate
      DB_USERNAME: ${DB_USERNAME:-matchmate}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MATCHMATE_CORS_ALLOWED_ORIGINS: ${MATCHMATE_CORS_ALLOWED_ORIGINS:-http://localhost}
      MANAGEMENT_ENDPOINTS: health
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - matchmate-net

  nginx:
    build:
      context: ./matchmate-mobile
      dockerfile: Dockerfile
    container_name: matchmate-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - matchmate-net

volumes:
  mysql-data:
  redis-data:

networks:
  matchmate-net:
    driver: bridge
