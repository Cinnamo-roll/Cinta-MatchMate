spring:
  application:
    name: matchmate-server
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/matchmate}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  session:
    timeout: 24h
    data:
      redis:
        namespace: matchmate:session
  cache:
    type: redis
    cache-names:
      - tag-categories
      - user-tags
      - user-views
      - user-recommendations
      - user-searches

server:
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health}
  health:
    redis:
      enabled: true

matchmate:
  cors:
    allowed-origins: ${MATCHMATE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,capacitor://localhost}
  cache:
    enabled: ${CACHE_ENABLED:true}
    lock-wait: 2s
    warmup:
      enabled: ${CACHE_WARMUP_ENABLED:true}
      recommendation-limits:
        - 8
    schedule:
      recommendation-refresh: ${CACHE_RECOMMENDATION_REFRESH:3m}
      category-refresh: ${CACHE_CATEGORY_REFRESH:1h}
  retention:
    chat-message-age: ${CHAT_MESSAGE_AGE:1d}
    cleanup-cron: ${DATA_RETENTION_CLEANUP_CRON:0 5 * * * *}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
