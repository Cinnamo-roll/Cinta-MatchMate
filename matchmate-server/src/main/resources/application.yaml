spring:
  application:
    name: matchmate-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/matchmate}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  session:
    timeout: 24h
    data:
      redis:
        namespace: matchmate:session
  cache:
    type: redis
    cache-names:
      - tag-categories
      - user-tags
      - user-views
      - user-recommendations
      - user-searches

server:
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health}
  health:
    redis:
      enabled: true

matchmate:
  cache:
    enabled: ${CACHE_ENABLED:true}
    lock-wait: 2s
    warmup:
      enabled: ${CACHE_WARMUP_ENABLED:true}
      recommendation-limits:
        - 8
    schedule:
      recommendation-refresh: ${CACHE_RECOMMENDATION_REFRESH:3m}
      category-refresh: ${CACHE_CATEGORY_REFRESH:1h}
